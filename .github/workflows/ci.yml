name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Type check tests
        run: pnpm run typecheck:tests

      - name: Unit tests
        run: pnpm run test:unit

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://thiepmungonline.com
        run: pnpm run build

      - name: Install Chromium for ceremony regression
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify all invitation ceremony layouts
        run: pnpm run test:ceremonies
