# Site-2 production compose (installed as /srv/chungdoi-site2/compose.yaml).
# Isolated from master: own project/container/image names, own loopback port
# (3221), own data volume. No public port binding — Cloudflare Tunnel and any
# host-local checks attach to 127.0.0.1:3221 only.
name: chungdoi-site2

services:
  web:
    image: chungdoi-site2-web:production
    container_name: chungdoi-site2-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3221:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: /srv/chungdoi-site2/.env
        required: true
    volumes:
      - /srv/chungdoi-site2/data:/app/data
      - site2-image-cache:/app/.next/cache
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    pids_limit: 192
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  site2-image-cache:
