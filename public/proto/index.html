<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forest prototype — thử nghiệm nâng cấp hình ảnh</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #0d1410;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #f4f1e6;
      }

      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .panel {
        position: fixed;
        left: 20px;
        bottom: 20px;
        padding: 16px 18px;
        border-radius: 14px;
        background: rgba(14, 22, 16, 0.72);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(244, 241, 230, 0.14);
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 268px;
      }

      #label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      #fps {
        font-size: 11px;
        color: rgba(244, 241, 230, 0.62);
        font-variant-numeric: tabular-nums;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .row label {
        font-size: 11px;
        color: rgba(244, 241, 230, 0.72);
        min-width: 34px;
      }

      input[type="range"] {
        flex: 1;
        accent-color: #c8d99c;
      }

      button {
        appearance: none;
        border: 1px solid rgba(244, 241, 230, 0.2);
        background: rgba(244, 241, 230, 0.08);
        color: #f4f1e6;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.16s ease;
      }

      button:hover {
        background: rgba(244, 241, 230, 0.16);
      }

      .buttons {
        display: flex;
        gap: 8px;
      }

      .buttons button {
        flex: 1;
      }

      .hint {
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 11px;
        color: rgba(244, 241, 230, 0.5);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <p class="hint">
      Di chuột để đổi góc nhìn.<br />
      Không dùng shadow map, không post-processing.
    </p>

    <div class="panel">
      <div>
        <p id="label">Đề xuất: cross-quad + billboard nhiều lớp</p>
        <p id="fps">đang đo…</p>
      </div>
      <div class="row">
        <label for="wind">Gió</label>
        <input id="wind" type="range" min="0" max="60" value="16" />
      </div>
      <div class="buttons">
        <button id="toggle" type="button">Xem bản hiện tại</button>
        <button id="orbit" type="button">Dừng xoay</button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
